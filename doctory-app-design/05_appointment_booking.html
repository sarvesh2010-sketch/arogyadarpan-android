</button>

<button class="w-[44px] h-[44px] rounded-full bg-surface-container-lowest clay-card flex items-center justify-center transition-transform active:scale-95 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">calendar_month</span>
</button>
</header>

<div class="px-container-margin-mobile space-y-section-gap pb-8">

<div class="flex items-center gap-1 mt-1 text-on-surface-variant font-caption text-caption">
<span class="material-symbols-outlined text-[14px]">location_on</span>
<span>San Jose, South</span>
</div>
</div>
</div>
</section>

<div class="flex justify-between items-center mb-4">

<span class="font-headline-md text-headline-md text-primary">12</span>

<!-- Date Card 2 -->

<span class="font-headline-md text-headline-md text-primary">13</span>

</div>
</label>
<label class="flex-1 relative cursor-pointer group">
<input class="peer sr-only" name="consultation" type="radio" value="video"/>
<div class="p-4 rounded-[20px] bg-surface-container-lowest border border-outline-variant/30 peer-checked:border-[#111315] peer-checked:bg-[#111315]/5 transition-all text-center">
<span class="material-symbols-outlined text-primary mb-2" style="font-variation-settings: 'FILL' 0;">videocam</span>
<div class="font-headline-md text-[16px] text-primary">Video Call</div>
<div class="font-caption text-caption text-outline">$45</div>
