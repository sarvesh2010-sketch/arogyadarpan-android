<script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('swipeContainer');
            const thumb = document.getElementById('swipeThumb');
            const text = document.getElementById('swipeText');
            
            let isDragging = false;
            let startX = 0;
            let currentX = 0;
            let maxTravel = 0;
            
            // Initialization
            const initSwipe = () => {
                const containerRect = container.getBoundingClientRect();
                const thumbRect = thumb.getBoundingClientRect();
                // 4px left padding, 4px right padding
                maxTravel = containerRect.width - thumbRect.width - 8; 
            };
            
            window.addEventListener('resize', initSwipe);
            initSwipe();
            
            const onDragStart = (e) => {
                isDragging = true;
                startX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                thumb.style.transition = 'none';
            };
            
            const onDragMove = (e) => {
                if (!isDragging) return;
                
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                currentX = clientX - startX;
                
                // Constrain movement
                if (currentX < 0) currentX = 0;
                if (currentX > maxTravel) currentX = maxTravel;
                
                thumb.style.transform = `translate(${currentX}px, -50%)`;
                
                // Fade text based on progress
                const progress = currentX / maxTravel;
                text.style.opacity = Math.max(0, 1 - (progress * 2));
            };
            
            const onDragEnd = () => {
                if (!isDragging) return;
                isDragging = false;
                
                thumb.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                
                if (currentX > maxTravel * 0.8) {
                    // Success! Complete the swipe
                    thumb.style.transform = `translate(${maxTravel}px, -50%)`;
                    
                    // Simulate navigation or action
                    setTimeout(() => {
                        thumb.innerHTML = '<span class="material-symbols-outlined text-primary text-[28px] font-bold">check</span>';
                        // Reset after demo
                        setTimeout(resetSwipe, 1500);
                    }, 300);
                } else {
                    // Snap back
                    resetSwipe();
                }
            };
            
            const resetSwipe = () => {
                thumb.style.transform = `translate(0px, -50%)`;
                text.style.opacity = '1';
                currentX = 0;
                thumb.innerHTML = '<span class="material-symbols-outlined text-primary text-[28px] font-bold">keyboard_double_arrow_right</span>';
            };
            
            // Touch events
            thumb.addEventListener('touchstart', onDragStart, {passive: true});
            window.addEventListener('touchmove', onDragMove, {passive: true});
            window.addEventListener('touchend', onDragEnd);
            
            // Mouse events for testing
            thumb.addEventListener('mousedown', onDragStart);
            window.addEventListener('mousemove', onDragMove);
            window.addEventListener('mouseup', onDragEnd);
        });
    </script>
